name: Regulatory Propagation Check

on:
  push:
    branches: [main]
    paths:
      - 'data/questions.json'
      - 'js/questions.js'
      - 'scripts/duplicate-propagation-check.js'
  pull_request:
    branches: [main]
    paths:
      - 'data/questions.json'
      - 'js/questions.js'
      - 'scripts/duplicate-propagation-check.js'

jobs:
  propagation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run propagation check
        run: node scripts/duplicate-propagation-check.js
